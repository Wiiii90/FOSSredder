name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve package version
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\s*\(\s*FossRedder\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not resolve project version from CMakeLists.txt"
          }
          echo "PACKAGE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Prepare staging dir
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "fossredder-staging-${{ github.job }}-${{ github.run_id }}"
          if (Test-Path $staging) { Remove-Item -Path $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          icacls $staging /grant "NT AUTHORITY\SYSTEM:(OI)(CI)F" /T | Out-Null
          echo "TARGET_DIR=$staging" >> $env:GITHUB_ENV

      - name: Clean previous build
        run: |
          if (Test-Path .build) { Remove-Item -Path .build -Recurse -Force }

      - name: Validate runner prerequisites
        run: .\ci\runner\assert-quality-runner.ps1 -RequireInnoSetup -RequireGitHubCli

      - name: Configure installer preset
        run: cmake -DTARGET_DIR="$env:TARGET_DIR" -DFOSSREDDER_FAST_QML_BUILD=ON --preset app

      - name: Build app and installer
        run: .\ci\package\build-installer.ps1

      - name: Validate installer artifact
        run: .\ci\package\validate-package.ps1 -DistDir .build\app\dist

      - name: Run installer QA
        run: .\ci\package\test-package-layout.ps1 -StagingDir .build\app\staging -DistDir .build\app\dist

      - name: Create release metadata
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: .\ci\release\create-release-metadata.ps1 -DistDir .build\app\dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = ".build\app\dist\FOSSredder-Setup-$env:PACKAGE_VERSION-win-x64.exe"
          $checksums = ".build\app\release\SHA256SUMS.txt"
          $manifest = ".build\app\release\release-manifest.json"
          $notes = ".build\app\release\release-notes.md"

          foreach ($path in @($installer, $checksums, $manifest, $notes)) {
            if (!(Test-Path $path)) {
              throw "Release file not found: $path"
            }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "FOSSredder $tag" `
              --notes-file $notes `
              $installer $checksums $manifest
          } else {
            gh release edit $tag `
              --title "FOSSredder $tag" `
              --notes-file $notes
            gh release upload $tag $installer $checksums $manifest --clobber
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: fossredder-installer
          path: .build/app/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v6
        with:
          name: fossredder-release-metadata
          path: .build/app/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fossredder-package-logs
          path: .build/logs/package/*
          if-no-files-found: warn
          retention-days: 30
