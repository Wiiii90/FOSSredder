name: Docs

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  doxygen:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate runner prerequisites
        run: .\ci\runner\assert-quality-runner.ps1 -RequireDoxygen -SkipBuildPrerequisites

      - name: Clean previous Doxygen output
        run: |
          if (Test-Path .\docs\html) { Remove-Item -Path .\docs\html -Recurse -Force }

      - name: Generate Doxygen HTML
        run: doxygen Doxyfile

      - name: Upload Doxygen artifact
        uses: actions/upload-artifact@v6
        with:
          name: fossredder-doxygen-html
          path: docs/html
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push'
    needs: doxygen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Doxygen artifact
        uses: actions/download-artifact@v6
        with:
          name: fossredder-doxygen-html
          path: doxygen-html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doxygen-html

      - name: Deploy Doxygen to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
