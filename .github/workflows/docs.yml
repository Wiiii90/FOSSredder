name: Docs

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: pwsh

jobs:
  doxygen:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate runner prerequisites
        run: .\ci\runner\assert-quality-runner.ps1 -RequireDoxygen -SkipBuildPrerequisites

      - name: Clean previous Doxygen output
        run: |
          if (Test-Path .\docs\html) { Remove-Item -Path .\docs\html -Recurse -Force }

      - name: Generate Doxygen HTML
        run: doxygen Doxyfile

      - name: Copy Doxygen assets
        run: |
          $iconTarget = ".\docs\html\app\assets\icons"
          New-Item -ItemType Directory -Path $iconTarget -Force | Out-Null
          Copy-Item -Path ".\app\assets\icons\fossredder.png" -Destination $iconTarget -Force

      - name: Upload Doxygen artifact
        uses: actions/upload-artifact@v6
        with:
          name: fossredder-doxygen-html
          path: docs/html
          if-no-files-found: error
          retention-days: 7
