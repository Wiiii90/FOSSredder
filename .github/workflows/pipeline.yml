name: Pipeline

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare staging dir
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "fossredder-staging-${{ github.job }}-${{ github.run_id }}"
          if (Test-Path $staging) { Remove-Item -Path $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          icacls $staging /grant "NT AUTHORITY\SYSTEM:(OI)(CI)F" /T | Out-Null
          echo "TARGET_DIR=$staging" >> $env:GITHUB_ENV

      - name: Ensure no running binaries
        run: |
          $procs = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'fossredder|_unit_tests|ui_interaction_tests|ui_unit_tests|opencv_unit_tests|persistence_unit_tests|qml' }
          if ($procs) { $procs | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue } }

      - name: Clean previous build
        run: |
          if (Test-Path .build) { Remove-Item -Path .build -Recurse -Force }

      - name: Validate runner prerequisites
        run: .\ci\runner\assert-quality-runner.ps1

      - name: Configure tests preset
        run: cmake -DTARGET_DIR="$env:TARGET_DIR" --preset tests

      - name: Build tests preset
        run: cmake --build --preset release-tests --parallel

      - name: Run test preset
        run: ctest --preset release-tests

  static-analysis:
    runs-on:
      - self-hosted
      - Windows
      - X64
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare staging dir
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "fossredder-staging-${{ github.job }}-${{ github.run_id }}"
          if (Test-Path $staging) { Remove-Item -Path $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          icacls $staging /grant "NT AUTHORITY\SYSTEM:(OI)(CI)F" /T | Out-Null
          echo "TARGET_DIR=$staging" >> $env:GITHUB_ENV

      - name: Clean previous build
        run: |
          if (Test-Path .build) { Remove-Item -Path .build -Recurse -Force }

      - name: Validate runner prerequisites
        run: .\ci\runner\assert-quality-runner.ps1 -RequireClangTidy

      - name: Configure clang-tidy preset
        run: cmake -DTARGET_DIR="$env:TARGET_DIR" --preset clang-tidy

      - name: Build clang-tidy preset
        run: cmake --build --preset release-clang-tidy --parallel

  coverage:
    runs-on:
      - self-hosted
      - Windows
      - X64
    needs: build-and-test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare staging dir
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "fossredder-staging-${{ github.job }}-${{ github.run_id }}"
          if (Test-Path $staging) { Remove-Item -Path $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          icacls $staging /grant "NT AUTHORITY\SYSTEM:(OI)(CI)F" /T | Out-Null
          echo "TARGET_DIR=$staging" >> $env:GITHUB_ENV

      - name: Clean previous build
        run: |
          if (Test-Path .build) { Remove-Item -Path .build -Recurse -Force }

      - name: Validate runner prerequisites
        run: .\ci\runner\assert-quality-runner.ps1 -RequireCoverageTools

      - name: Configure coverage preset
        run: cmake -DTARGET_DIR="$env:TARGET_DIR" --preset coverage

      - name: Build coverage preset
        run: cmake --build --preset release-coverage --parallel

      - name: Collect LLVM coverage
        run: .\ci\coverage\coverage-windows.ps1 -BuildDir .build\coverage -Config Release -OutDir coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error

      - name: Upload Codecov report
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: .\ci\coverage\upload-codecov.ps1 -CoverageFile .\coverage\coverage.lcov

  documentation:
    runs-on:
      - self-hosted
      - Windows
      - X64
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate runner prerequisites
        run: .\ci\runner\assert-quality-runner.ps1 -RequireDoxygen -SkipBuildPrerequisites

      - name: Clean previous Doxygen output
        run: |
          if (Test-Path .\docs\html) { Remove-Item -Path .\docs\html -Recurse -Force }

      - name: Generate Doxygen HTML
        run: doxygen Doxyfile

      - name: Copy Doxygen assets
        run: |
          $iconTarget = ".\docs\html\app\assets\icons"
          New-Item -ItemType Directory -Path $iconTarget -Force | Out-Null
          Copy-Item -Path ".\app\assets\icons\fossredder.png" -Destination $iconTarget -Force

      - name: Upload Doxygen artifact
        uses: actions/upload-artifact@v6
        with:
          name: doxygen-html
          path: docs/html
          if-no-files-found: error
          retention-days: 7

  publish-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    needs:
      - coverage
      - documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Doxygen artifact
        uses: actions/download-artifact@v7
        with:
          name: doxygen-html
          path: site/api

      - name: Download coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage-artifact

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          mkdir -p site/coverage
          cp -R coverage-artifact/html/. site/coverage/
          cp ci/pages/index.html site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
